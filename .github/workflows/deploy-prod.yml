name: Prod deployment

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write 
  pull-requests: write

jobs:
  prod-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: qarani/llm-inference-service:prod
  

  prod-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: prod-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/llm-inference-python:prod

  prod-deploy:
    needs: prod-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest



    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker network create aws-prod-network || true
            docker pull qarani/llm-inference-python:prod
            docker service rm llm-inference-python-prod || true
            docker service create \
              --name llm-inference-python-prod \
              --network aws-prod-network \
              --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
              --mount type=bind,source=/home/ubuntu/apps/storage/llm,target=/app/models \
              --env ENV=prod \
              --env DB_HOST=postgres-prod \
              --env DB_PORT=5432 \
              --env DB_USER=postgres-prod-user \
              --env DB_PASSWORD=postgres-prod-password \
              --env DB_NAME=llm_db \
              --env NATS_URL=nats://nats-prod:4222 \
              --env NATS_USER=nats-prod-user \
              --env NATS_PASSWORD=nats-prod-password \
              --env MAX_TOKENS=2048 \
              --env TEMPERATURE=0.7 \
              --env LOG_LEVEL=DEBUG \
              --env REQUEST_TIMEOUT=60 \
              --env MODEL_PATH=/app/models/tinyllama-1.1b-chat-v1.0.Q5_K_M.gguf \
              qarani/llm-inference-python:prod


