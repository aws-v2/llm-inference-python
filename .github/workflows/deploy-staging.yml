name: Staging Deployment pipeline

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
permissions:
  contents: write 
  pull-requests: write

jobs:
  staging-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  staging-build-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/llm-inference-python:staging

  staging-deploy:
    needs: staging-build-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Staging via SSH over Tailscale....
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker network create aws-staging-network || true
            docker pull qarani/llm-inference-python:staging
            docker stop llm-inference-python-staging || true
            docker rm llm-inference-python-staging || true
            docker run -d --name llm-inference-python-staging \
              --network aws-staging-network \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /home/x6617274696/aws/models:/app/models \
              -e APP_PROFILE=staging \
              -e DB_HOST=postgres-staging \
              -e DB_PORT=5432 \
              -e DB_USER=postgres-staging-user \
              -e DB_PASSWORD=postgres-staging-password \
              -e DB_NAME=llm_db \
              -e NATS_URL=nats://nats-staging:4222 \
              -e NATS_USER=nats-staging-user \
              -e NATS_PASSWORD=nats-staging-password \
              -e MAX_TOKENS=2048 \
              -e TEMPERATURE=0.7 \
              -e LOG_LEVEL=DEBUG \
              -e REQUEST_TIMEOUT=60 \
              -e MODEL_PATH=/app/models/tinyllama-1.1b-chat-v1.0.Q5_K_M.gguf \
              qarani/llm-inference-python:staging

  staging-open-pr-to-main:
    needs: staging-deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR staging → main
        run: |
          if gh pr list --base main --head staging --state open --json number | jq -e 'length > 0' > /dev/null; then
            echo "PR already exists. Skipping..."
          else
            gh pr create \
              --base main \
              --head staging \
              --title "chore: promote staging → main" \
              --body "✅ Staging deployment succeeded. Auto-generated PR for production release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}



